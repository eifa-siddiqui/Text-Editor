<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad - Text Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Consolas&family=Segoe+UI:wght@400;500;600&display=swap');

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .editor-font {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 22px;
    }

    #editor::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    #editor::selection {
      color: #0f172a;
      background-color: rgba(59, 130, 246, 0.28);
      -webkit-text-fill-color: #0f172a;
    }

    #highlight-layer {
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* Synchronized scrolling line numbers */
    .line-numbers {
      counter-reset: line-counter;
      user-select: none;
    }

    /* Custom highlight for search hits */
    mark.match-active {
      background-color: #facc15;
      color: #000;
      border-radius: 2px;
      box-shadow: 0 0 0 1px #eab308;
    }

    mark.match-found {
      background-color: #fef08a;
      color: #000;
      border-radius: 2px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .tool-button {
      padding: 0.25rem 0.625rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.25rem;
      background: #f8fafc;
    }
    .tool-button:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden select-none">

  <!-- ================= WINDOW HEADER / TITLEBAR ================= -->
  <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2">
      <i class="fa-regular fa-note-sticky text-blue-600 text-lg"></i>
      <span id="window-title" class="font-medium text-sm text-slate-700">Untitled.txt</span>
    </div>
    <div class="flex items-center space-x-2 text-xs text-slate-500">
      <span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-medium border border-blue-200">Notepad</span>
    </div>
  </header>

  <!-- ================= TOOLBAR RIBBON ================= -->
  <div class="bg-slate-50 border-b border-slate-200 px-3 py-1.5 flex items-center justify-between text-xs text-slate-700">
    <div class="flex items-center space-x-1">
      <!-- File Operations -->
      <button onclick="newFile()" title="New Document (Ctrl+N)" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 transition">
        <i class="fa-regular fa-file text-slate-600"></i>
        <span>New</span>
      </button>

      <button onclick="openFileDialog()" title="Open File" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 transition cursor-pointer">
        <i class="fa-regular fa-folder-open text-amber-600"></i>
        <span>Open</span>
      </button>

      <button id="save-button" onclick="saveFile()" title="Save (Ctrl+S)" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed disabled:opacity-100 disabled:hover:bg-slate-200 transition">
        <i class="fa-regular fa-floppy-disk text-emerald-600"></i>
        <span>Save</span>
      </button>

      <button onclick="saveFileAs()" title="Save under a different filename" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 transition">
        <i class="fa-regular fa-pen-to-square text-blue-600"></i>
        <span>Save As</span>
      </button>

      <button onclick="exportPDF()" title="Export PDF" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 transition">
        <i class="fa-solid fa-file-pdf text-red-500"></i>
        <span>PDF</span>
      </button>

      <div class="w-px h-5 bg-slate-300 mx-1"></div>

      <!-- Undo / Redo Operations -->
      <button id="btn-undo" onclick="performUndo()" title="Undo (Ctrl+Z)" disabled class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 disabled:opacity-40 disabled:hover:bg-transparent transition">
        <i class="fa-solid fa-rotate-left text-slate-600"></i>
        <span>Undo</span>
      </button>

      <button id="btn-redo" onclick="performRedo()" title="Redo (Ctrl+Y)" disabled class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 disabled:opacity-40 disabled:hover:bg-transparent transition">
        <i class="fa-solid fa-rotate-right text-slate-600"></i>
        <span>Redo</span>
      </button>

      <div class="w-px h-5 bg-slate-300 mx-1"></div>

      <!-- Find & Replace Toggle -->
      <button onclick="toggleFindBar()" title="Find & Replace (Ctrl+F)" class="flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-slate-200 active:bg-slate-300 transition">
        <i class="fa-solid fa-magnifying-glass text-blue-600"></i>
        <span>Find & Replace</span>
      </button>
    </div>

    <!-- Quick Algorithm Indicator Badge -->
    <div class="flex items-center gap-2">
      <span class="text-[11px] text-slate-500">Search Algorithm:</span>
      <select id="algo-select" onchange="onAlgoChange()" class="bg-white border border-slate-300 rounded px-2 py-0.5 text-xs text-slate-700 font-medium focus:outline-none focus:border-blue-500">
        <option value="BM">Boyer-Moore (Fastest)</option>
        <option value="KMP">KMP (Prefix-Shift)</option>
      </select>
    </div>
  </div>

  <!-- ================= FIND & REPLACE DOCKED TOOLBAR ================= -->
  <div id="find-toolbar" class="hidden bg-white border-b border-slate-200 px-4 py-2 text-xs shadow-sm flex flex-wrap items-center gap-3">
    <!-- Find Input -->
    <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-2 py-1">
      <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
      <input type="text" id="find-query" placeholder="Find text..." oninput="executeSearch()" class="bg-transparent focus:outline-none text-slate-700 w-44 editor-font" />
      <span id="find-counter" class="text-[11px] text-slate-400 font-mono">0 matches</span>
    </div>
    <div id="comparison-counter" class="flex items-center gap-2 rounded border border-slate-300 bg-slate-50 px-2 py-1 text-[11px] font-mono text-slate-600" aria-live="polite">
      <span>Comparisons:</span>
      <span id="kmp-counter" class="text-blue-700">KMP 0</span>
      <span class="text-slate-300">|</span>
      <span id="bm-counter" class="text-violet-700">Boyer-Moore 0</span>
    </div>
    <div class="flex items-center gap-1">
      <button onclick="navigateMatch(-1)" title="Previous match" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-100">Prev</button>
      <button onclick="navigateMatch(1)" title="Next match" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-100">Next</button>
    </div>

    <!-- Options -->
    <div class="flex items-center gap-3 text-slate-600">
      <label class="flex items-center gap-1 cursor-pointer select-none">
        <input type="checkbox" id="find-case" onchange="executeSearch()" class="rounded text-blue-600" />
        <span>Match Case</span>
      </label>
      <label class="flex items-center gap-1 cursor-pointer select-none">
        <input type="checkbox" id="find-word" onchange="executeSearch()" class="rounded text-blue-600" />
        <span>Whole Word</span>
      </label>
    </div>

    <div class="w-px h-5 bg-slate-300"></div>

    <!-- Replace Input & Buttons -->
    <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-2 py-1">
      <i class="fa-solid fa-arrows-rotate text-slate-400"></i>
      <input type="text" id="replace-query" placeholder="Replace with..." class="bg-transparent focus:outline-none text-slate-700 w-36 editor-font" />
    </div>

    <div class="flex items-center gap-1">
      <button onclick="replaceNextMatch()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 transition">
        Replace
      </button>
      <button onclick="replaceAllMatches()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded transition font-medium">
        Replace All
      </button>
    </div>

    <button onclick="toggleFindBar()" class="ml-auto text-slate-400 hover:text-slate-600 p-1">
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>
  </div>

  <!-- ================= C++ DOCUMENT TOOLS ================= -->
  <div id="cpp-tools" class="bg-white border-b border-slate-200 px-4 py-2 text-xs flex flex-wrap items-center gap-3">
    <button onclick="toggleCppTools()" class="px-2.5 py-1 rounded border border-slate-300 bg-slate-50 hover:bg-slate-100">
      C++ Editing Tools
    </button>
    <div id="cpp-tools-content" class="hidden flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-1">
        <input id="tool-line" type="number" min="1" placeholder="Line" class="w-16 border border-slate-300 rounded px-2 py-1" />
        <input id="tool-column" type="number" min="1" placeholder="Column" class="w-16 border border-slate-300 rounded px-2 py-1" />
        <input id="tool-text" type="text" placeholder="Text" class="w-32 border border-slate-300 rounded px-2 py-1" />
      </div>
      <button onclick="cppInsertLine()" class="tool-button">Insert Line</button>
      <button onclick="cppUpdateLine()" class="tool-button">Update Line</button>
      <button onclick="cppDeleteLine()" class="tool-button">Delete Line</button>
      <div class="flex items-center gap-1">
        <input id="tool-last-line" type="number" min="1" placeholder="Last" class="w-16 border border-slate-300 rounded px-2 py-1" />
        <button onclick="cppDeleteLineRange()" class="tool-button">Delete Range</button>
      </div>
      <button onclick="cppInsertText()" class="tool-button">Insert Text</button>
      <div class="flex items-center gap-1">
        <input id="tool-length" type="number" min="1" placeholder="Length" class="w-16 border border-slate-300 rounded px-2 py-1" />
        <button onclick="cppDeleteText()" class="tool-button">Delete Text</button>
      </div>
      <div class="flex items-center gap-1">
        <input id="tool-word" type="text" placeholder="Word" class="w-24 border border-slate-300 rounded px-2 py-1" />
        <button onclick="cppFrequency()" class="tool-button">Frequency</button>
      </div>
      <button onclick="cppAllFrequencies()" class="tool-button">All Frequencies</button>
      <span id="cpp-tools-output" class="max-w-md font-mono text-slate-700"></span>
    </div>
  </div>

  <!-- ================= NOTEPAD TYPING CANVAS ================= -->
  <main class="flex-1 flex bg-white overflow-hidden relative">
    
    <!-- Line Numbers Gutter -->
    <div id="gutter" class="w-12 bg-slate-50 border-r border-slate-200 text-slate-400 editor-font text-right pr-2 pt-3 select-none overflow-hidden shrink-0">
      <div>1</div>
    </div>

    <!-- Main Clean White Typing Screen -->
    <div class="flex-1 relative overflow-hidden">
      <div id="highlight-layer" aria-hidden="true" class="absolute inset-0 p-3 pt-3 text-slate-800 editor-font overflow-hidden pointer-events-none"></div>
      <textarea id="editor" wrap="off" spellcheck="false" placeholder="Start typing your text here..." 
        oninput="handleEditorInput()" 
        onscroll="syncScroll()" 
        onkeyup="updateCursorPosition()" 
        onclick="updateCursorPosition()"
        class="relative z-10 w-full h-full p-3 pt-3 bg-transparent text-transparent caret-slate-800 editor-font resize-none focus:outline-none overflow-y-auto leading-[22px] select-text"></textarea>
    </div>
  </main>

  <!-- ================= BOTTOM STATUS BAR ================= -->
  <footer class="bg-slate-100 border-t border-slate-200 px-4 py-1 flex items-center justify-between text-xs text-slate-600 select-none">
    <div class="flex items-center gap-4">
      <span><strong class="text-slate-800">Ln:</strong> <span id="stat-line">1</span>, <strong class="text-slate-800">Col:</strong> <span id="stat-col">1</span></span>
      <span class="text-slate-300">|</span>
      <span><strong class="text-slate-800">Lines:</strong> <span id="stat-lines-total">1</span></span>
      <span><strong class="text-slate-800">Words:</strong> <span id="stat-words">0</span></span>
      <span><strong class="text-slate-800">Characters:</strong> <span id="stat-chars">0</span></span>
    </div>
    <div class="flex items-center gap-3 text-[11px] text-slate-500">
      <span id="save-status" role="status" aria-live="polite"></span>
      <span>UTF-8</span>
    </div>
  </footer>

  <!-- ================= APPLICATION ENGINE SCRIPT ================= -->
  <script>
    // Browser script: presentation and C++ API calls only.

    const editor = document.getElementById('editor');
    const gutter = document.getElementById('gutter');
    const highlightLayer = document.getElementById('highlight-layer');

    let currentFileName = "Untitled.txt";
    let activeAlgorithm = "BM";
    let searchMatches = [];
    let currentMatchIndex = -1;
    let syncTimer = null;
    const cppApiBase = "http://127.0.0.1:8080";

    async function cppApi(path, options = {}) {
      const response = await fetch(cppApiBase + path, options);
      if (!response.ok) throw new Error(`C++ server returned ${response.status}`);
      return response.json();
    }

    function syncCppDocument() {
      return cppApi('/api/set', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: editor.value })
      }).then(result => {
        updateUndoButtons(result.undoCount, result.redoCount);
        updateSaveButton(result.dirty);
        updateCppFilename(result.filename);
        updateLineNumbers(result.lines);
        return result;
      }).catch(error => console.error('C++ document sync failed:', error));
    }

    // Initialize initial text
    function initEditor() {
      const initial = "Welcome to Text Editor\nThis is my first saved file.\nFile handling is working.";
      editor.value = initial;
      syncDocumentFromTextarea(false);
      cppApi('/api/open-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: initial })
      }).then(result => {
        updateUndoButtons(result.undoCount, result.redoCount);
        updateSaveButton(result.dirty);
        updateCppFilename(result.filename);
      })
        .catch(error => console.error('C++ initial document setup failed:', error));
      updateLineNumbers();
      updateStats();
      renderSearchHighlights();
      updateWindowTitle();
      updateSaveButton();
    }

    function updateWindowTitle() {
      document.getElementById('window-title').innerText = currentFileName;
      document.title = `${currentFileName} - Text Editor`;
    }

    function updateSaveButton(dirty = true) {
      const clean = !dirty;
      const button = document.getElementById('save-button');
      button.disabled = clean;
      button.setAttribute('aria-disabled', clean ? 'true' : 'false');
      button.querySelector('span').innerText = clean ? 'Saved' : 'Save';
      button.title = clean ? 'No unsaved changes' : 'Save changes (Ctrl+S)';
      document.getElementById('save-status').innerText = clean ? 'Saved' : 'Unsaved changes';
    }

    function updateCppFilename(filename) {
      if (!filename) return;
      currentFileName = filename.split(/[\\\\/]/).pop();
      updateWindowTitle();
    }

    // Synchronize textarea text with Doubly Linked List
    function syncDocumentFromTextarea() {
      updateLineNumbers();
      updateStats();
    }

    // Synchronize gutter line numbers
    function updateLineNumbers(lineCount) {
      if (Number.isInteger(lineCount) && lineCount >= 1) {
        let gutterHTML = '';
        for (let i = 1; i <= lineCount; i++) {
          gutterHTML += `<div style="height:22px;line-height:22px">${i}</div>`;
        }
        gutter.innerHTML = gutterHTML;
        document.getElementById('stat-lines-total').innerText = lineCount;
        return;
      }
      cppApi('/api/stats').then(result => {
        let gutterHTML = '';
        for (let i = 1; i <= result.lines; i++) {
          gutterHTML += `<div style="height:22px;line-height:22px">${i}</div>`;
        }
        gutter.innerHTML = gutterHTML;
        document.getElementById('stat-lines-total').innerText = result.lines;
      }).catch(error => console.error('C++ line numbers failed:', error));
    }

    // Keep line numbers scrolled in sync with the textarea
    function syncScroll() {
      gutter.scrollTop = editor.scrollTop;
      highlightLayer.scrollTop = editor.scrollTop;
      highlightLayer.scrollLeft = editor.scrollLeft;
    }

    function handleEditorInput() {
      syncDocumentFromTextarea();
      updateStats();
      updateSaveButton();
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncCppDocument, 150);
      if (!document.getElementById('find-toolbar').classList.contains('hidden')) {
        executeSearch();
      } else {
        searchMatches = [];
        currentMatchIndex = -1;
        renderSearchHighlights();
      }
    }

    // Update cursor line and column numbers
    function updateCursorPosition() {
      const pos = editor.selectionStart;
      const textBefore = editor.value.substring(0, pos);
      const lines = textBefore.split('\n');
      const lineNum = lines.length;
      const colNum = lines[lines.length - 1].length + 1;

      document.getElementById('stat-line').innerText = lineNum;
      document.getElementById('stat-col').innerText = colNum;
    }

    // Document Statistics
    function updateStats() {
      cppApi('/api/stats').then(result => {
        document.getElementById('stat-lines-total').innerText = result.lines;
        document.getElementById('stat-chars').innerText = result.characters;
      }).catch(error => console.error('C++ stats failed:', error));
      cppApi('/api/frequencies').then(result => {
        const words = result.reduce((total, item) => total + item.count, 0);
        document.getElementById('stat-words').innerText = words;
      }).catch(error => console.error('C++ word count failed:', error));
    }

    function toggleCppTools() {
      document.getElementById('cpp-tools-content').classList.toggle('hidden');
    }

    function showCppDocumentResult(result) {
      if (typeof result.text === 'string') {
        editor.value = result.text;
      }
      updateUndoButtons(result.undoCount, result.redoCount);
      updateSaveButton(result.dirty);
      updateCppFilename(result.filename);
      updateLineNumbers();
      updateStats();
      updateSaveButton();
      if (!document.getElementById('find-toolbar').classList.contains('hidden')) executeSearch();
    }

    async function cppLineOperation(operation, extra = {}) {
      const result = await cppApi('/api/line', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          operation,
          position: Number(document.getElementById('tool-line').value),
          text: document.getElementById('tool-text').value,
          last: Number(document.getElementById('tool-last-line').value),
          ...extra
        })
      });
      showCppDocumentResult(result);
      document.getElementById('cpp-tools-output').innerText =
        result.success ? 'C++ operation successful' : 'Invalid C++ operation';
    }

    function cppInsertLine() { cppLineOperation('insert'); }
    function cppUpdateLine() { cppLineOperation('update'); }
    function cppDeleteLine() { cppLineOperation('delete'); }
    function cppDeleteLineRange() { cppLineOperation('deleteRange'); }

    async function cppTextOperation(operation) {
      const result = await cppApi('/api/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          operation,
          line: Number(document.getElementById('tool-line').value),
          column: Number(document.getElementById('tool-column').value),
          text: document.getElementById('tool-text').value,
          length: Number(document.getElementById('tool-length').value)
        })
      });
      showCppDocumentResult(result);
      document.getElementById('cpp-tools-output').innerText =
        result.success ? 'C++ operation successful' : 'Invalid C++ operation';
    }

    function cppInsertText() { cppTextOperation('insert'); }
    function cppDeleteText() { cppTextOperation('delete'); }

    async function cppFrequency() {
      const word = document.getElementById('tool-word').value;
      const result = await cppApi('/api/frequency?word=' + encodeURIComponent(word));
      document.getElementById('cpp-tools-output').innerText =
        `${word} appears ${result.count} time(s)`;
    }

    async function cppAllFrequencies() {
      const frequencies = await cppApi('/api/frequencies');
      document.getElementById('cpp-tools-output').innerText =
        frequencies.length
          ? frequencies.map(item => `${item.word}: ${item.count}`).join(' | ')
          : 'No words found';
    }

    // Undo & Redo
    function performUndo() {
      cppApi('/api/undo', { method: 'POST' }).then(result => {
        if (!result.changed) return;
        editor.value = result.text;
        updateUndoButtons(result.undoCount, result.redoCount);
        updateLineNumbers();
        updateStats();
        updateSaveButton();
        if (!document.getElementById('find-toolbar').classList.contains('hidden')) executeSearch();
        else renderSearchHighlights();
      }).catch(error => console.error('C++ undo failed:', error));
    }

    function performRedo() {
      cppApi('/api/redo', { method: 'POST' }).then(result => {
        if (!result.changed) return;
        editor.value = result.text;
        updateUndoButtons(result.undoCount, result.redoCount);
        updateLineNumbers();
        updateStats();
        updateSaveButton();
        if (!document.getElementById('find-toolbar').classList.contains('hidden')) executeSearch();
        else renderSearchHighlights();
      }).catch(error => console.error('C++ redo failed:', error));
    }

    function updateUndoButtons(undoCount = 0, redoCount = 0) {
      document.getElementById('btn-undo').disabled = undoCount <= 0;
      document.getElementById('btn-redo').disabled = redoCount <= 0;
    }

    // -------------------------------------------------------------------------
    // 4. FIND & REPLACE LOGIC
    // -------------------------------------------------------------------------

    function toggleFindBar() {
      const bar = document.getElementById('find-toolbar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) {
        document.getElementById('find-query').focus();
        executeSearch();
      } else {
        searchMatches = [];
        currentMatchIndex = -1;
        renderSearchHighlights();
      }
    }

    function onAlgoChange() {
      activeAlgorithm = document.getElementById('algo-select').value;
      executeSearch();
    }

    async function executeSearch() {
      const query = document.getElementById('find-query').value;
      const matchCase = document.getElementById('find-case').checked;
      const matchWord = document.getElementById('find-word').checked;
      const counter = document.getElementById('find-counter');
      const kmpCounter = document.getElementById('kmp-counter');
      const bmCounter = document.getElementById('bm-counter');

      searchMatches = [];
      currentMatchIndex = -1;

      if (!query) {
        counter.innerText = '0 matches';
        kmpCounter.innerText = 'KMP 0';
        bmCounter.innerText = 'Boyer-Moore 0';
        kmpCounter.className = 'text-blue-700';
        bmCounter.className = 'text-violet-700';
        renderSearchHighlights();
        return;
      }

      await syncCppDocument();

      let text = editor.value;
      let pattern = query;

      if (!matchCase) {
        text = text.toLowerCase();
        pattern = pattern.toLowerCase();
      }

      const params = new URLSearchParams({
        pattern,
        caseSensitive: matchCase ? 'true' : 'false',
        wholeWord: matchWord ? 'true' : 'false',
        algorithm: activeAlgorithm
      });

      Promise.all([
        cppApi('/api/search?' + new URLSearchParams({ ...Object.fromEntries(params), algorithm: 'KMP' })),
        cppApi('/api/search?' + new URLSearchParams({ ...Object.fromEntries(params), algorithm: 'BM' }))
      ]).then(([kmpResult, bmResult]) => {
        kmpCounter.innerText = `KMP ${kmpResult.comparisons}`;
        bmCounter.innerText = `Boyer-Moore ${bmResult.comparisons}`;
        kmpCounter.className = activeAlgorithm === 'KMP'
          ? 'font-bold text-blue-700'
          : 'text-blue-700';
        bmCounter.className = activeAlgorithm === 'BM'
          ? 'font-bold text-violet-700'
          : 'text-violet-700';

        const rawMatches = activeAlgorithm === 'KMP'
          ? kmpResult.matches
          : bmResult.matches;

        const lineOffsets = [0];
        const lines = editor.value.split('\n');
        for (let i = 0; i < lines.length; i++) {
          lineOffsets.push(lineOffsets[i] + lines[i].length + 1);
        }
        searchMatches = rawMatches.map(match => lineOffsets[match.line - 1] + match.column - 1);

        if (searchMatches.length > 0) {
          currentMatchIndex = 0;
          counter.innerText = `${searchMatches.length} match${searchMatches.length === 1 ? '' : 'es'}`;
        } else {
          counter.innerText = '0 matches';
        }
        renderSearchHighlights();
      }).catch(error => {
        counter.innerText = 'C++ server unavailable';
        kmpCounter.innerText = 'KMP --';
        bmCounter.innerText = 'Boyer-Moore --';
        console.error(error);
      });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function renderSearchHighlights() {
      const text = editor.value;
      const queryLength = document.getElementById('find-query').value.length;
      let html = '';
      let cursor = 0;
      for (let i = 0; i < searchMatches.length; i++) {
        const start = searchMatches[i];
        if (start < cursor) continue;
        html += escapeHtml(text.slice(cursor, start));
        const cls = i === currentMatchIndex ? 'match-active' : 'match-found';
        html += `<mark class="${cls}">${escapeHtml(text.slice(start, start + queryLength))}</mark>`;
        cursor = start + queryLength;
      }
      html += escapeHtml(text.slice(cursor));
      if (text.endsWith('\n')) html += ' ';
      highlightLayer.innerHTML = html;
      highlightLayer.scrollTop = editor.scrollTop;
      highlightLayer.scrollLeft = editor.scrollLeft;
    }

    // Searching leaves focus and caret in place. Jump only when the user
    // explicitly selects a result with Prev or Next.
    function navigateMatch(direction) {
      if (searchMatches.length === 0) return;
      currentMatchIndex = (currentMatchIndex + direction + searchMatches.length) % searchMatches.length;
      const startIndex = searchMatches[currentMatchIndex];
      editor.focus();
      // A range selection paints over the overlay highlight. Move only the
      // caret to the match so the active result stays visibly highlighted.
      editor.setSelectionRange(startIndex, startIndex);
      renderSearchHighlights();
      updateCursorPosition();
    }

    function replaceNextMatch() {
      const query = document.getElementById('find-query').value;
      const replacement = document.getElementById('replace-query').value;
      if (!query || searchMatches.length === 0) return;
      cppApi('/api/replace', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pattern: query,
          replacement,
          occurrence: currentMatchIndex + 1,
          caseSensitive: document.getElementById('find-case').checked,
          wholeWord: document.getElementById('find-word').checked
        })
      }).then(result => {
        editor.value = result.text;
        updateUndoButtons(result.undoCount, result.redoCount);
        updateLineNumbers();
        updateStats();
        updateSaveButton();
        executeSearch();
      }).catch(error => console.error('C++ replace failed:', error));
    }

    function replaceAllMatches() {
      const query = document.getElementById('find-query').value;
      const replacement = document.getElementById('replace-query').value;
      if (!query || searchMatches.length === 0) return;
      cppApi('/api/replace', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pattern: query,
          replacement,
          caseSensitive: document.getElementById('find-case').checked,
          wholeWord: document.getElementById('find-word').checked
        })
      }).then(result => {
        editor.value = result.text;
        updateUndoButtons(result.undoCount, result.redoCount);
        updateLineNumbers();
        updateStats();
        updateSaveButton();
        executeSearch();
      }).catch(error => console.error('C++ replace failed:', error));
    }

    // -------------------------------------------------------------------------
    // 5. FILE HANDLING & ACTIONS
    // -------------------------------------------------------------------------

    function newFile() {
      editor.value = "";
      syncDocumentFromTextarea(false);
      cppApi('/api/new', { method: 'POST' })
        .then(result => {
          updateUndoButtons(result.undoCount, result.redoCount);
          updateSaveButton(result.dirty);
          updateCppFilename(result.filename);
        })
        .catch(error => console.error('C++ new document failed:', error));
      searchMatches = [];
      currentMatchIndex = -1;
      renderSearchHighlights();
      currentFileName = "Untitled.txt";
      updateWindowTitle();
      updateSaveButton();
    }

    async function openFileDialog() {
      const status = document.getElementById('save-status');
      status.innerText = 'Opening C++ file dialog...';
      try {
        const result = await cppApi('/api/open-dialog', { method: 'POST' });
        if (!result.opened) {
          status.innerText = result.cancelled
            ? 'Open cancelled.'
            : 'C++ file open failed.';
          return;
        }
        showCppDocumentResult(result);
        currentFileName = result.filename.split(/[\\\\/]/).pop();
        updateWindowTitle();
        updateSaveButton();
        status.innerText = `Opened by C++: ${result.filename}`;
      } catch (error) {
        status.innerText = 'C++ server unavailable.';
        console.error(error);
      }
    }

    async function saveFile() {
      await saveDocumentWithCpp(
        currentFileName === "Untitled.txt" ? "" : currentFileName
      );
    }

    async function saveFileAs() {
      const status = document.getElementById('save-status');
      status.innerText = 'Opening C++ Save As dialog...';
      try {
        const result = await cppApi('/api/save-as', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: editor.value, filename: currentFileName })
        });
        if (result.saved) {
          updateSaveButton(false);
          updateCppFilename(result.filename);
          status.innerText = `Saved by C++: ${result.filename}`;
        } else {
          status.innerText = 'Save As cancelled.';
        }
      } catch (error) {
        status.innerText = 'C++ server unavailable.';
        console.error(error);
      }
    }

    async function saveDocumentWithCpp(filename) {
      const status = document.getElementById('save-status');
      status.innerText = 'Saving through C++...';

      try {
        const result = await cppApi('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, text: editor.value })
        });

        if (result.saved) {
          updateSaveButton(false);
          updateCppFilename(result.filename);
          status.innerText = `Saved by C++: ${result.filename}`;
        } else {
          status.innerText = 'C++ file save failed.';
        }
      } catch (error) {
        status.innerText = 'C++ server unavailable. Start TextEditorServer.exe.';
        console.error(error);
      }
    }

    function exportPDF() {
      exportPdfWithCpp("");
    }

    async function exportPdfWithCpp(filename) {
      const status = document.getElementById('save-status');
      status.innerText = 'Exporting PDF through C++...';
      try {
        const result = await cppApi('/api/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, text: editor.value })
        });
        status.innerText = result.exported
          ? `C++ PDF exported: ${result.filename}`
          : (result.cancelled ? 'PDF export cancelled.' : 'C++ PDF export failed.');
      } catch (error) {
        status.innerText = 'C++ server unavailable. Start TextEditorServer.exe.';
        console.error(error);
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        setTimeout(() => {
          syncCppDocument();
          syncDocumentFromTextarea();
        }, 0);
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        performUndo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        performRedo();
      } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveFileAs();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (!document.getElementById('save-button').disabled) saveFile();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFindBar();
      }
    });

    // Start on load
    window.onload = function() {
      initEditor();
    };
  </script>
</body>
</html>
